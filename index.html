    let activeHead = 'startup';

    function initHeadTabs() {
      const tabsBar = document.getElementById('headTabsBar');
      tabsBar.innerHTML = Object.keys(complianceCatalog).map(key => {
        const item = complianceCatalog[key];
        const isActive = key === activeHead;
        return `
          <button onclick="selectHead('${key}')" class="head-tab px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${
            isActive ? 'bg-brand-600 text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
          }">
            ${item.title}
          </button>
        `;
      }).join('');
      renderServices();
    }

    function selectHead(key) {
      activeHead = key;
      initHeadTabs();
    }

    function renderServices() {
      const current = complianceCatalog[activeHead];
      document.getElementById('currentHeadTitle').textContent = current.title;
      document.getElementById('serviceCountBadge').textContent = `${current.services.length} Services`;

      const grid = document.getElementById('subServiceGrid');
      grid.innerHTML = current.services.map((s, idx) => `
        <div onclick="openModal('${activeHead}', ${idx})" class="group cursor-pointer bg-white p-5 rounded-2xl border border-slate-200 hover:border-brand-600 hover:shadow-lg transition-all flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-blue-50 text-brand-600">Click for Docs</span>
              <span class="text-[11px] font-semibold text-slate-400">${s.timeline}</span>
            </div>
            <h4 class="text-sm font-extrabold text-slate-900 group-hover:text-brand-600 transition mb-1">${s.name}</h4>
            <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${s.desc}</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-brand-600">
            <span>View Required Documents</span>
            <span class="group-hover:translate-x-1 transition-transform">&rarr;</span>
          </div>
        </div>
      `).join('');
    }

    function openModal(headKey, index) {
      const data = complianceCatalog[headKey].services[index];
      document.getElementById('modalCategoryTag').textContent = complianceCatalog[headKey].title;
      document.getElementById('modalServiceTitle').textContent = data.name;
      document.getElementById('modalTimeline').textContent = `⏱ Estimated Processing Time: ${data.timeline}`;
      document.getElementById('modalDescription').textContent = data.desc;

      document.getElementById('modalDocList').innerHTML = data.docs.map(doc => `
        <li class="flex items-start gap-2">
          <span class="text-emerald-600 font-bold">✓</span>
          <span>${doc}</span>
        </li>
      `).join('');

      document.getElementById('modalDeliverables').innerHTML = data.deliverables.map(del => `
        <div class="p-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-brand-600"></span>
          <span>${del}</span>
        </div>
      `).join('');

      document.getElementById('modalWhatsAppBtn').href = `https://wa.me/919355476488?text=${encodeURIComponent(`Hi Maraqs Commerce, I want to apply for ${data.name}. Please guide me through the document verification.`)}`;

      const modal = document.getElementById('detailModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Initialize UI on load
    initHeadTabs();
  </script>
